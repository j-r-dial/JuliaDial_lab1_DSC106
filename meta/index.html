<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
    <script type="module" src="main.js"></script>
    
</head>
<body>

    <h1>Meta</h1>
    <p>This page shows stats about my website's code. </p>

    <div style="display: flex; align-items: baseline;">
        <label style="flex: 1;">
          Show commits until:
          <input type="range" id="commit-progress" min="0" max="100" value="100">
        </label>
        <time id="commit-time" style="margin-left: auto;"></time>
      </div>

      <dl id="files">
        <!-- we want the following structure for each file:
        <div>
          <dt>
            <code>{file.name}</code>
          </dt>
          <dd>{file.lines.length} lines</dd>
        </div>
        -->
      </dl>
      
    <div id="stats"></div>


    <div id="scrolly-1">
      <div id="scatter-story"></div>
      <div id="scatter-plot">
        <h2>Commits by time of day</h2>
        <div id="chart"></div>
        <p id="selection-count">No commits selected</p>
        <dl id="commit-tooltip" class="info tooltip">
            <dt>Commit</dt>
            <dd>
              <a href="" id="commit-link" target="_blank"></a>
            </dd>
            <dt>Date</dt>
            <dd id="commit-date"></dd>
        </dl>
        <dl id="commit-tooltip" class="info tooltip" hidden></dl>
        <dl id="language-breakdown" class="stats"></dl>
      </div>
    </div>


    <dl id="files"></dl>



</body>
</html>
